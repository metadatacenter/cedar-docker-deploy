name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate compose stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out cedar-docker-deploy
        uses: actions/checkout@v6
        with:
          path: CEDAR/cedar-docker-deploy

      - name: Check out cedar-development
        uses: actions/checkout@v6
        with:
          repository: metadatacenter/cedar-development
          ref: develop
          path: CEDAR/cedar-development

      - name: Install the environment a fresh installation would have
        shell: bash
        run: |
          # An installation copies these two out of bin/templates and fills them in.
          # Leaving the "changeme" placeholders is deliberate: this job checks that every
          # variable a compose file references is defined, not that its value is usable.
          cd "${GITHUB_WORKSPACE}/CEDAR"
          cp cedar-development/bin/templates/set-env-external.sh .
          cp cedar-development/bin/templates/set-env-internal.sh .

      - name: Validate every stack
        shell: bash
        run: |
          export CEDAR_HOME="${GITHUB_WORKSPACE}/CEDAR"
          source "${CEDAR_HOME}/cedar-development/bin/templates/cedar-profile-docker-eval.sh"

          # docker compose config parses and interpolates without contacting the daemon, so
          # this runs anywhere. It exits 0 on an undefined variable and only warns, which is
          # the failure that actually reaches a bring-up, so the warning is what we gate on.
          # GitHub runs this with `bash -e`, so every assignment from a command substitution has to
          # tolerate a non-zero exit: grep returns 1 when it matches nothing, which is the healthy
          # case here and would otherwise abort the step before it printed anything.
          failed=0
          for stack in cedar-infrastructure cedar-microservices cedar-frontend cedar-admin; do
              out=$(cd "${CEDAR_HOME}/cedar-docker-deploy/${stack}" && docker compose config --quiet 2>&1) && rc=0 || rc=$?
              undefined=$(echo "${out}" | grep 'variable is not set' | grep -oE 'CEDAR_[A-Z0-9_]+' | sort -u || true)
              if [ ${rc} -ne 0 ]; then
                  echo "FAIL ${stack}: compose file is not valid"
                  echo "${out}"
                  failed=1
              elif [ -n "${undefined}" ]; then
                  echo "FAIL ${stack}: referenced but not defined by the profile:"
                  echo "${undefined}" | sed 's/^/         /'
                  failed=1
              else
                  echo "OK   ${stack}"
              fi
          done
          exit ${failed}

      - name: Check out cedar-docker-build
        uses: actions/checkout@v6
        with:
          repository: metadatacenter/cedar-docker-build
          ref: develop
          path: CEDAR/cedar-docker-build

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check every server is given the environment its code requires
        shell: bash
        run: |
          export CEDAR_HOME="${GITHUB_WORKSPACE}/CEDAR"

          # A server declares what it needs in code, and a needed-but-unset variable is fatal at
          # startup. Four compose entries once did not supply what the code declared, so those
          # servers could not start at all. The checker asks the code rather than reading the
          # descriptor by eye, so the two cannot drift apart again.
          version=$(grep -oE '[0-9][^ ]*' "${CEDAR_HOME}/cedar-docker-deploy/cedar-microservices/.env" | head -1)
          # SystemComponent is defined by cedar-core-library. Both jars are thin, so jshell
          # needs config plus core on its explicit classpath even though Maven resolves the
          # transitive POM dependencies while downloading them from Nexus.
          for artifact in cedar-config-library cedar-core-library; do
              mvn -q org.apache.maven.plugins:maven-dependency-plugin:3.5.0:get \
                  -DremoteRepositories=https://nexus.bmir.stanford.edu/repository/snapshots \
                  -Dartifact="org.metadatacenter:${artifact}:${version}"
          done

          "${CEDAR_HOME}/cedar-development/ops/check_docker_env.py"

      - name: Check for duplicate container addresses and host ports
        shell: bash
        run: |
          export CEDAR_HOME="${GITHUB_WORKSPACE}/CEDAR"
          source "${CEDAR_HOME}/cedar-development/bin/templates/cedar-profile-docker-eval.sh"

          for stack in cedar-infrastructure cedar-microservices cedar-frontend cedar-admin; do
              (cd "${CEDAR_HOME}/cedar-docker-deploy/${stack}" && docker compose config 2>/dev/null)
          done > /tmp/resolved.yml

          failed=0
          dup_ip=$(grep -E 'ipv4_address' /tmp/resolved.yml | sed 's/.*: *//' | sort | uniq -d || true)
          if [ -n "${dup_ip}" ]; then
              echo "FAIL two containers share a static address:"
              echo "${dup_ip}" | sed 's/^/         /'
              failed=1
          fi

          dup_port=$(grep -E '^ +published:' /tmp/resolved.yml | sed 's/.*: *//' | tr -d '"' | sort | uniq -d || true)
          if [ -n "${dup_port}" ]; then
              echo "FAIL two containers publish the same host port:"
              echo "${dup_port}" | sed 's/^/         /'
              failed=1
          fi

          if [ ${failed} -eq 0 ]; then echo "OK   addresses and host ports are unique across all stacks"; fi
          exit ${failed}
