server {
  listen 80 default_server;
  server_name _;

  # Temporary compatibility redirects preserve the complete path and query.
  # They are deliberately non-permanent so rollback cannot be defeated by a
  # browser or intermediary retaining an old route decision.
  location ~ ^/(templates|elements|fields)(?:/|$) {
    add_header X-Cedar-Routing-Mode split always;
    return 307 http://localhost:4282$request_uri;
  }

  location / {
    proxy_pass http://host.docker.internal:4201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Cedar-Routing-Mode split always;
  }
}
