# These stacks run images; they do not build them. `cedarcli docker build` is the only builder:
# it builds the CEDAR base images a target is built FROM first, which a compose-driven build does
# not, and it supplies the locked server versions from cedar-docker-build/bin/cedar-images-base.sh
# as build arguments the Dockerfiles declare with no default. A `build:` stanza here would be a
# second builder producing a differently-built image under the same tag, so there is none.
services:
  mysql:
    container_name: infra-mysql
    restart: unless-stopped
    healthcheck:
      # /healthcheck.sh came with Oracle's abandoned mysql/mysql-server image; the Docker Official
      # image this is now built on ships no such script.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$CEDAR_MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    image: "metadatacenter/cedar-infra-mysql:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_KEYCLOAK_MYSQL_HOST}
    ports:
      - ${CEDAR_KEYCLOAK_MYSQL_PORT}:3306
    volumes:
      - log_mysql:/var/log/mysql
      - mysql_data:/var/lib/mysql
    environment:
      - CEDAR_MYSQL_ROOT_PASSWORD

  mongo:
    container_name: infra-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    image: "metadatacenter/cedar-infra-mongo:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_MONGO_HOST}
    ports:
      - "${CEDAR_MONGO_PORT}:27017"
    volumes:
      - log_mongo:/data/log
      - mongo_data:/data/db
      - mongo_state:/data/state
      - mongo_configdb:/data/configdb
    environment:
      - CEDAR_MONGO_ROOT_USER_NAME
      - CEDAR_MONGO_ROOT_USER_PASSWORD
      - CEDAR_MONGO_APP_USER_NAME
      - CEDAR_MONGO_APP_USER_PASSWORD

  redis-persistent:
    container_name: infra-redis-persistent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    image: "metadatacenter/cedar-infra-redis-persistent:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_REDIS_PERSISTENT_HOST}
    ports:
      - ${CEDAR_REDIS_PERSISTENT_PORT}:6379
    volumes:
      - log_redis:/log
      - redis_data:/data
    sysctls:
      - net.core.somaxconn=512

  opensearch:
    container_name: infra-opensearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    image: "metadatacenter/cedar-infra-opensearch:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_OPENSEARCH_HOST}
    ports:
      - ${CEDAR_OPENSEARCH_REST_PORT}:9200
      - ${CEDAR_OPENSEARCH_TRANSPORT_PORT}:9300
    volumes:
      - log_opensearch:/usr/share/opensearch/logs
      - opensearch_data:/usr/share/opensearch/data
    environment:
      - discovery.type=single-node
      - cluster.name=opensearch_cedar
      - plugins.security.disabled=true

  neo4j:
    container_name: infra-neo4j
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    image: "metadatacenter/cedar-infra-neo4j:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_NEO4J_HOST}
    ports:
      - ${CEDAR_NEO4J_REST_PORT}:7474
      - ${CEDAR_NEO4J_BOLT_PORT}:7687
    volumes:
      - log_neo4j:/logs
      - neo4j_data:/data
      - neo4j_state:/state
    environment:
      - CEDAR_NEO4J_USER_NAME
      - CEDAR_NEO4J_USER_PASSWORD
      - CEDAR_HOST
      - CEDAR_ADMIN_USER_API_KEY

  keycloak:
    container_name: infra-keycloak
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    image: "metadatacenter/cedar-infra-keycloak:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_KEYCLOAK_HOST}
    ports:
      - ${CEDAR_KEYCLOAK_HTTP_PORT}:8080
      - ${CEDAR_KEYCLOAK_HTTPS_PORT}:8443
    volumes:
      - log_keycloak:/opt/keycloak/data/log
      - keycloak_state:/opt/keycloak/data/state
    environment:
      - CEDAR_MYSQL_ROOT_PASSWORD
      - CEDAR_KEYCLOAK_MYSQL_USER
      - CEDAR_KEYCLOAK_MYSQL_PASSWORD
      - CEDAR_KEYCLOAK_MYSQL_PORT
      - CEDAR_KEYCLOAK_MYSQL_HOST
      - CEDAR_KEYCLOAK_MYSQL_DB
      - CEDAR_KEYCLOAK_ADMIN_USER
      - CEDAR_KEYCLOAK_ADMIN_PASSWORD
      - CEDAR_ADMIN_USER_API_KEY
      - CEDAR_HOST
      - CEDAR_RESOURCE_SERVER_HOST
      - CEDAR_RESOURCE_HTTP_PORT
      - CEDAR_NET_IP_MYSQL
      - CEDAR_KEYCLOAK_HTTP_PORT
      - CEDAR_KEYCLOAK_HTTPS_PORT

  nginx:
    container_name: infra-nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    image: "metadatacenter/cedar-infra-nginx:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_NGINX_HOST}
    ports:
      - ${CEDAR_NGINX_HTTP_PORT}:80
      - ${CEDAR_NGINX_HTTPS_PORT}:443
    volumes:
      - log_nginx:/etc/nginx/log
      - cedar_cert:/usr/local/etc/certificates
      # Static files served at shared.${CEDAR_HOST}; a checkout on the host, as in the native stack.
      - ${CEDAR_HOME}/cedar-shared-data:/usr/local/etc/shared-data:ro
      # The Swagger UI, served at /api on the API vhosts; a checkout, as in the native stack.
      - ${CEDAR_HOME}/cedar-swagger-ui:/usr/local/etc/swagger-ui:ro
    environment:
      - CEDAR_HOST
      - CEDAR_MICROSERVICE_HOST
      - CEDAR_KEYCLOAK_HOST
      - CEDAR_FRONTEND_EDITOR_HOST
      - CEDAR_FRONTEND_CONTENT_HOST
      - CEDAR_FRONTEND_OPENVIEW_HOST
      - CEDAR_FRONTEND_MONITORING_HOST
      - CEDAR_FRONTEND_BRIDGING_HOST
      - CEDAR_FRONTEND_WORKSPACE_HOST
      - CEDAR_FRONTEND_DESIGNER_HOST

networks:
  cedarnet:
    name: cedarnet
    external: true

volumes:
  cedar_cert:
    name: cedar_cert
    external: true

  opensearch_data:
    name: opensearch_data
  log_opensearch:
    name: log_opensearch

  keycloak_state:
    name: keycloak_state
  log_keycloak:
    name: log_keycloak

  mongo_data:
    name: mongo_data
  mongo_state:
    name: mongo_state
  mongo_configdb:
    name: mongo_configdb
  log_mongo:
    name: log_mongo

  mysql_data:
    name: mysql_data
  log_mysql:
    name: log_mysql

  neo4j_data:
    name: neo4j_data
  neo4j_state:
    name: neo4j_state
  log_neo4j:
    name: log_neo4j

  log_nginx:
    name: log_nginx

  redis_data:
    name: redis_data
  log_redis:
    name: log_redis
