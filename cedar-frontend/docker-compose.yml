# These stacks run images; they do not build them. `cedarcli docker build` is the only builder:
# it builds the CEDAR base images a target is built FROM first, which a compose-driven build does
# not, and it supplies the locked server versions from cedar-docker-build/bin/cedar-images-base.sh
# as build arguments the Dockerfiles declare with no default. A `build:` stanza here would be a
# second builder producing a differently-built image under the same tag, so there is none.
services:
  frontend-main:
    container_name: frontend-main
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "metadatacenter/cedar-frontend-main:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_EDITOR_HOST}
    ports:
      - "${CEDAR_FRONTEND_EDITOR_PORT}:4200"
    volumes:
      - log_frontend_main:/log
    environment:
      - CEDAR_HOST
  frontend-content:
    container_name: frontend-content
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4240/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "metadatacenter/cedar-frontend-content:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_CONTENT_HOST}
    ports:
      - "${CEDAR_FRONTEND_CONTENT_PORT}:4240"
    volumes:
      - log_frontend_content:/log
    environment:
      - CEDAR_HOST
  frontend-openview:
    container_name: frontend-openview
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4220/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "metadatacenter/cedar-frontend-openview:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_OPENVIEW_HOST}
    ports:
      - "${CEDAR_FRONTEND_OPENVIEW_PORT}:4220"
    volumes:
      - log_frontend_openview:/log
    environment:
      - CEDAR_HOST
  frontend-monitoring:
    container_name: frontend-monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4300/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "metadatacenter/cedar-frontend-monitoring:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_MONITORING_HOST}
    ports:
      - "${CEDAR_FRONTEND_MONITORING_PORT}:4300"
    volumes:
      - log_frontend_monitoring:/log
    environment:
      - CEDAR_HOST
  frontend-bridging:
    container_name: frontend-bridging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4340/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "metadatacenter/cedar-frontend-bridging:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_BRIDGING_HOST}
    ports:
      - "${CEDAR_FRONTEND_BRIDGING_PORT}:4340"
    volumes:
      - log_frontend_bridging:/log
    environment:
      - CEDAR_HOST

networks:
  cedarnet:
    name: cedarnet
    external: true

volumes:
  log_frontend_main:
    name: log_frontend_main
  log_frontend_content:
    name: log_frontend_content
  log_frontend_openview:
    name: log_frontend_openview
  log_frontend_monitoring:
    name: log_frontend_monitoring
  log_frontend_bridging:
    name: log_frontend_bridging
