# These stacks run images; they do not build them. `cedarcli docker build` is the only builder:
# it builds the CEDAR base images a target is built FROM first, which a compose-driven build does
# not, and it supplies the locked server versions from cedar-docker-build/bin/cedar-images-base.sh
# as build arguments the Dockerfiles declare with no default. A `build:` stanza here would be a
# second builder producing a differently-built image under the same tag, so there is none.
services:
  frontend-main:
    container_name: frontend-main
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "${CEDAR_IMAGE_PREFIX}/cedar-frontend-main:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_EDITOR_CONTAINER_HOST}
    ports:
      - "${CEDAR_FRONTEND_EDITOR_PORT}:4200"
    volumes:
      - log_frontend_main:/log
    environment:
      - CEDAR_HOST
  frontend-content:
    container_name: frontend-content
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4240/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "${CEDAR_IMAGE_PREFIX}/cedar-frontend-content:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_CONTENT_CONTAINER_HOST}
    ports:
      - "${CEDAR_FRONTEND_CONTENT_PORT}:4240"
    volumes:
      - log_frontend_content:/log
    environment:
      - CEDAR_HOST
  frontend-openview:
    container_name: frontend-openview
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4220/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "${CEDAR_IMAGE_PREFIX}/cedar-frontend-openview:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_OPENVIEW_CONTAINER_HOST}
    ports:
      - "${CEDAR_FRONTEND_OPENVIEW_PORT}:4220"
    volumes:
      - log_frontend_openview:/log
    environment:
      - CEDAR_HOST
  frontend-monitoring:
    container_name: frontend-monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4300/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "${CEDAR_IMAGE_PREFIX}/cedar-frontend-monitoring:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_MONITORING_CONTAINER_HOST}
    ports:
      - "${CEDAR_FRONTEND_MONITORING_PORT}:4300"
    volumes:
      - log_frontend_monitoring:/log
    environment:
      - CEDAR_HOST
  frontend-bridging:
    container_name: frontend-bridging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4340/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "${CEDAR_IMAGE_PREFIX}/cedar-frontend-bridging:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_BRIDGING_CONTAINER_HOST}
    ports:
      - "${CEDAR_FRONTEND_BRIDGING_PORT}:4340"
    volumes:
      - log_frontend_bridging:/log
    environment:
      - CEDAR_HOST

  frontend-workspace:
    container_name: frontend-workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4201/config/version.js >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "${CEDAR_IMAGE_PREFIX}/cedar-frontend-workspace:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_WORKSPACE_CONTAINER_HOST}
    ports:
      - "${CEDAR_FRONTEND_WORKSPACE_PORT}:4201"
    volumes:
      - log_frontend_workspace:/log
    environment:
      CEDAR_HOST: "${CEDAR_HOST}"
      CEDAR_WORKSPACE_FRONTEND_URL: "${CEDAR_WORKSPACE_FRONTEND_URL:-https://workspace.${CEDAR_HOST}}"
      CEDAR_TEMPLATE_DESIGNER_FRONTEND_URL: "${CEDAR_TEMPLATE_DESIGNER_FRONTEND_URL:-https://designer.${CEDAR_HOST}}"

  frontend-template-designer:
    container_name: frontend-template-designer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4202/config/version.js >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: "${CEDAR_IMAGE_PREFIX}/cedar-frontend-template-designer:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_FRONTEND_DESIGNER_CONTAINER_HOST}
    ports:
      - "${CEDAR_FRONTEND_DESIGNER_PORT}:4202"
    volumes:
      - log_frontend_template_designer:/log
    environment:
      CEDAR_HOST: "${CEDAR_HOST}"
      CEDAR_WORKSPACE_FRONTEND_URL: "${CEDAR_WORKSPACE_FRONTEND_URL:-https://workspace.${CEDAR_HOST}}"
      CEDAR_TEMPLATE_DESIGNER_FRONTEND_URL: "${CEDAR_TEMPLATE_DESIGNER_FRONTEND_URL:-https://designer.${CEDAR_HOST}}"

networks:
  cedarnet:
    name: cedarnet
    external: true

volumes:
  log_frontend_main:
    name: log_frontend_main
  log_frontend_content:
    name: log_frontend_content
  log_frontend_openview:
    name: log_frontend_openview
  log_frontend_monitoring:
    name: log_frontend_monitoring
  log_frontend_bridging:
    name: log_frontend_bridging
  log_frontend_workspace:
    name: log_frontend_workspace
  log_frontend_template_designer:
    name: log_frontend_template_designer
