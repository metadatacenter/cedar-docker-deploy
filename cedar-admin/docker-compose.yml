# These stacks run images; they do not build them. `cedarcli docker build` is the only builder:
# it builds the CEDAR base images a target is built FROM first, which a compose-driven build does
# not, and it supplies the locked server versions from cedar-docker-build/bin/cedar-images-base.sh
# as build arguments the Dockerfiles declare with no default. A `build:` stanza here would be a
# second builder producing a differently-built image under the same tag, so there is none.
services:
  redis-commander:
    container_name: admin-redis-commander
    restart: unless-stopped
    image: "${CEDAR_IMAGE_PREFIX}/cedar-admin-redis-commander:${CEDAR_DOCKER_VERSION}"
    networks:
      - cedarnet
    ports:
      - ${CEDAR_REDIS_COMMANDER_PORT}:8081
    environment:
      - CEDAR_NET_GATEWAY
      - CEDAR_REDIS_PERSISTENT_HOST
      - CEDAR_REDIS_PERSISTENT_PORT

  kibana:
    container_name: admin-kibana
    restart: unless-stopped
    image: "${CEDAR_IMAGE_PREFIX}/cedar-admin-kibana:${CEDAR_DOCKER_VERSION}"
    networks:
      - cedarnet
    ports:
      - ${CEDAR_KIBANA_PORT}:5601
    environment:
      # Without this it defaults to http://elasticsearch:9200, which does not exist on cedarnet.
      - OPENSEARCH_HOSTS=http://${CEDAR_OPENSEARCH_HOST}:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true

  phpmyadmin:
    container_name: admin-phpmyadmin
    restart: unless-stopped
    image: "${CEDAR_IMAGE_PREFIX}/cedar-admin-phpmyadmin:${CEDAR_DOCKER_VERSION}"
    networks:
      - cedarnet
    ports:
      - ${CEDAR_PHPMYADMIN_PORT}:80
    environment:
      - PMA_ARBITRARY=1

  admin-tool:
    container_name: admin-tool
    restart: unless-stopped
    image: "${CEDAR_IMAGE_PREFIX}/cedar-admin-tool:${CEDAR_DOCKER_VERSION}"
    networks:
      - cedarnet
    volumes:
      - cedar_ca:/cedar/ca
    environment:
      - CEDAR_HOST
      - CEDAR_NET_GATEWAY
      - CEDAR_MONGO_APP_USER_NAME
      - CEDAR_MONGO_APP_USER_PASSWORD
      - CEDAR_MONGO_HOST
      - CEDAR_MONGO_PORT
      - CEDAR_ADMIN_USER_PASSWORD
      - CEDAR_ADMIN_USER_API_KEY
      - CEDAR_NEO4J_HOST
      - CEDAR_NEO4J_REST_PORT
      - CEDAR_NEO4J_BOLT_PORT
      - CEDAR_NEO4J_USER_NAME
      - CEDAR_NEO4J_USER_PASSWORD
      - CEDAR_SALT_API_KEY
      - CEDAR_CADSR_ADMIN_USER_API_KEY
      - CEDAR_REDIS_PERSISTENT_HOST
      - CEDAR_REDIS_PERSISTENT_PORT
      - CEDAR_RESOURCE_SERVER_HOST
    extra_hosts:
      - "auth.${CEDAR_HOST}:${CEDAR_NGINX_HOST}"


networks:
  cedarnet:
    name: cedarnet
    external: true

volumes:
  cedar_ca:
    name: cedar_ca
    external: true
