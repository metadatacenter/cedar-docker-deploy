# This stack runs images; it does not build them. `cedarcli docker build` is the only builder:
# it builds the CEDAR base images a target is built FROM first, which a compose-driven build does
# not, and it supplies the locked server versions from cedar-docker-build/bin/cedar-images-base.sh
# as build arguments the Dockerfiles declare with no default. A `build:` stanza here would be a
# second builder producing a differently-built image under the same tag, so there is none.
#
# The cedar-java and cedar-microservice base images are not services here either: they have no
# process to run, and listing them only to force build order left two dead containers behind
# every "up".
services:
  server-schema:
    container_name: server-schema
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9103/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    image: "metadatacenter/cedar-server-schema:${CEDAR_DOCKER_VERSION}"
    networks:
      cedarnet:
        ipv4_address: ${CEDAR_SCHEMA_SERVER_HOST}
    ports:
      - "${CEDAR_SCHEMA_HTTP_PORT}:9003"
      - "${CEDAR_SCHEMA_ADMIN_PORT}:9103"
      - "${CEDAR_SCHEMA_STOP_PORT}:9203"
    volumes:
      - log_schema:/cedar/log/server-schema/
      - cedar_ca:/cedar/ca
    environment:
      - CEDAR_HOST
      - CEDAR_NET_GATEWAY
      - CEDAR_MONGO_APP_USER_NAME
      - CEDAR_MONGO_APP_USER_PASSWORD
      - CEDAR_MONGO_HOST
      - CEDAR_MONGO_PORT
      - CEDAR_NEO4J_HOST
      - CEDAR_NEO4J_REST_PORT
      - CEDAR_NEO4J_BOLT_PORT
      - CEDAR_NEO4J_USER_NAME
      - CEDAR_NEO4J_USER_PASSWORD
      - CEDAR_REDIS_PERSISTENT_HOST
      - CEDAR_REDIS_PERSISTENT_PORT
    # Every server verifies bearer tokens against the realm at auth.<host>, so every server
    # needs that name to reach the nginx container rather than resolving to itself.
    extra_hosts:
      - "auth.${CEDAR_HOST}:${CEDAR_NGINX_HOST}"
  server-user:
    container_name: server-user
